<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brushline Rally · Web</title><style>
@font-face{font-family:Chakra;src:url('/loader-art/chakra-bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#10151b;color:#eee2c5;font:16px/1.5 system-ui,sans-serif}body{overflow:hidden}canvas{width:100%;height:100%;object-fit:contain;outline:none}[hidden]{display:none!important}button,a{font:inherit;font-weight:700;cursor:pointer;text-decoration:none;border-radius:0}button:disabled{opacity:.45;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #eee2c5;outline-offset:5px}#toolbar{position:fixed;top:10px;right:10px;display:flex;gap:8px;opacity:.35}#toolbar:hover,#toolbar:focus-within{opacity:1}#toolbar button,#toolbar a{padding:8px 12px;font-size:13px;background:#20252b;color:#eee2c5;border:1px solid #eee2c555}
#panel{--ink:#eee2c5;position:fixed;inset:0;z-index:2;overflow:auto;background:#10151b;padding:clamp(24px,4vw,64px);display:grid;align-content:center;isolation:isolate}.poster{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}.poster-shade{position:fixed;inset:0;background:#10151be8;z-index:-1;transition:opacity .2s}#panel[data-phase=ready]{--ink:#20252b;color:#20252b}#panel[data-phase=ready] .poster-shade{opacity:0}.departure{width:min(1184px,100%);margin:auto}.registration{display:flex;justify-content:flex-end;gap:4px;height:11px;position:absolute;right:4%;top:18px}.registration i{width:19px;background:#246263;transform:skewX(-26deg)}.registration i:nth-child(2){background:#d6a83c}.registration i:nth-child(3){background:#ae4e36}.registration i:nth-child(4){background:#493e5c}
h1{margin:0 0 26px;line-height:0}.wordmark{display:block;width:min(100%,1000px);height:auto;overflow:visible}.wordmark .rally-ink{fill:var(--ink)}.checkpoint{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:0 0 10px}#status{font-weight:700;font-size:clamp(21px,2.3vw,30px);margin:0}#amount{font:700 clamp(28px,3vw,40px)/1 Chakra,monospace;font-variant-numeric:tabular-nums}.track{height:20px;background:#343b44;position:relative;overflow:hidden}.track:after{content:'';position:absolute;right:0;top:0;width:40px;height:100%;background:conic-gradient(#eee2c5 25%,#20252b 0 50%,#eee2c5 0 75%,#20252b 0) 0 0/20px 20px;opacity:.8}progress{display:block;appearance:none;width:100%;height:100%;border:0;background:transparent;color:#f05a28}progress::-webkit-progress-bar{background:transparent}progress::-webkit-progress-value{background:#f05a28;transition:width .12s}progress::-moz-progress-bar{background:#f05a28}#panel[data-phase=launcher] .track:before,#panel[data-phase=engine] .track:before{content:'';position:absolute;inset:0 auto 0 0;width:28%;background:#f05a28;animation:readiness 1.8s ease-in-out infinite}#panel[data-phase=error] .track{opacity:.35}#detail{font-size:13px;line-height:1.6;min-height:21px;margin:9px 0 18px;color:inherit;opacity:.76}
.art-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.art-card{background:#20252bf5;position:relative;min-height:180px;height:clamp(180px,29vh,280px);overflow:hidden;display:flex;align-items:center;justify-content:center}.art-card:after{content:'';position:absolute;left:22px;right:22px;bottom:19px;height:2px;background:#f05a2880}.art-card:nth-child(2){background:#2d323ef5}.art-card img{width:100%;height:100%;object-fit:contain;padding:12px 40px 20px}.art-card .plate{position:absolute;left:22px;top:14px;font:700 20px Chakra,system-ui;color:#eee2c5}.art-card .grain{position:absolute;right:0;bottom:0;width:35%;height:70%;opacity:.17;background:radial-gradient(#eee2c5 1px,transparent 1.6px) 0 0/9px 9px;mask-image:linear-gradient(135deg,transparent,#000)}
.actions{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:24px;min-height:60px}.back{display:flex;align-items:center;gap:10px;color:#eee2c5;background:#20252be8;padding:15px 22px;border-bottom:2px solid #f05a28;font-size:15px}.actions svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6}.primary{display:flex;align-items:center;justify-content:space-between;gap:44px;min-width:300px;min-height:64px;padding:15px 24px;border:2px solid #eee2c5;background:#f05a28;color:#fff4da;font-size:23px;box-shadow:inset 0 0 0 2px #f05a28}.primary:hover{background:#e76a3e}.primary svg{width:28px;height:28px}.steps{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}noscript{display:block;margin-top:16px}#panel[data-phase=ready] .track,#panel[data-phase=ready] #amount{visibility:hidden}#panel[data-phase=ready] #detail{min-height:0;margin:0}#panel[data-phase=ready] .checkpoint{margin-bottom:0}#panel[data-phase=ready] h1{margin-bottom:18px}
@keyframes readiness{from{transform:translateX(-100%)}to{transform:translateX(460%)}}
@media(max-width:650px){#panel{padding:26px 22px}.registration{top:14px;right:24px}h1{margin-top:25px;margin-bottom:28px}.wordmark{width:100%}.art-grid{gap:10px}.art-card{min-height:140px;height:23vh;max-height:220px}.art-card img{padding:20px 4px 10px}.art-card .plate{font-size:16px;left:14px;top:12px}.art-card:after{left:14px;right:14px;bottom:13px}.actions{gap:12px;flex-wrap:wrap;margin-top:24px}.primary{min-width:0;flex:1;min-height:56px;font-size:19px;padding:12px 17px;gap:18px}.back{padding:15px 12px;font-size:13px}.back svg{width:18px}.track{height:16px}#detail{font-size:12px}#status{font-size:22px}}
@media(max-height:560px) and (min-width:651px){#panel{padding:22px 38px}.wordmark{max-width:660px}h1{margin-bottom:12px}.art-card{height:150px;min-height:120px}.actions{margin-top:14px;min-height:48px}.primary{min-height:48px;font-size:19px}.back{padding:10px 18px}#detail{margin-bottom:10px}.track{height:14px}}
@media(prefers-reduced-motion:reduce){.poster-shade,progress::-webkit-progress-value{transition:none}#panel .track:before{animation:none;width:100%;opacity:.3}}
</style></head><body><canvas id="canvas" tabindex="0" aria-label="Brushline Rally 游戏画面"></canvas><div id="toolbar"><button id="fullscreen" aria-label="全屏">全屏</button><a href="/">返回首页</a></div>
<section id="panel" data-phase="launcher" aria-label="赛前准备"><svg class="poster" viewBox="0 0 1280 720" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#20252b" opacity=".18"/></pattern></defs><path fill="#f5e9d1" d="M0 0h1280v720H0z"/><path fill="#e85828" d="M794 0h486v194L678 346Z"/><path fill="#20252b" d="M960 0h320v29L896 144Z"/><path fill="url(#dots)" d="M794 0h486v194L678 346Z"/><path fill="#d15b32" d="m0 562 128-80 141 44 166-116 218 130 230-108 192 65 205-130v353H0Z"/><path fill="#202b31" d="m0 655 218-129 204 93 218-115 243 79 192-101 205 65v173H0Z"/><g fill="#18262c"><path d="m30 720 25-235 35 75H69l38 75H85l42 85zm1090 0 45-340 46 112h-23l43 105h-24l53 123z"/></g></svg><div class="poster-shade"></div><div class="registration" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="departure"><h1 aria-label="Brushline Rally"><svg class="wordmark" viewBox="0 0 9349 830" aria-hidden="true"><g transform="translate(-40 780) scale(1 -1)"><path fill="#eb562b" transform="translate(0 0)" d="M65 700H504L604 600V404L564 363L635 291V108L527 0H65ZM434 407 470 443V551L435 586H198V407ZM458 114 501 157V255L458 298H198V114Z"/><path fill="#eb562b" transform="translate(670 0)" d="M615 232V0H479V201L419 268H201V0H65V700H504L611 592V380L543 311ZM201 380H442L477 415V551L442 586H201Z"/><path fill="#eb562b" transform="translate(1345 0)" d="M65 120V700H201V167L252 116H448L499 167V700H635V120L515 0H185Z"/><path fill="#eb562b" transform="translate(2045 0)" d="M50 108V208H184V149L217 116H424L458 150V266L425 299H160L52 407V592L160 700H476L584 592V491H450V551L417 584H219L186 551V448L219 415H484L592 307V110L482 0H158Z"/><path fill="#eb562b" transform="translate(2682 0)" d="M65 700H201V407H497V700H633V0H497V291H201V0H65Z"/><path fill="#eb562b" transform="translate(3380 0)" d="M65 700H201V115H551V0H65Z"/><path fill="#eb562b" transform="translate(3941 0)" d="M70 700H206V0H70Z"/><path fill="#eb562b" transform="translate(4217 0)" d="M65 700H187L499 225H501V700H632V0H510L198 474H196V0H65Z"/><path fill="#eb562b" transform="translate(4914 0)" d="M65 700H571V585H201V408H542V295H201V115H571V0H65Z"/><path class="rally-ink" transform="translate(5792 0)" d="M615 232V0H479V201L419 268H201V0H65V700H504L611 592V380L543 311ZM201 380H442L477 415V551L442 586H201Z"/><path class="rally-ink" transform="translate(6467 0)" d="M261 700H385L641 0H503L446 155H200L143 0H5ZM416 267 323 533H321L231 267Z"/><path class="rally-ink" transform="translate(7113 0)" d="M65 700H201V115H551V0H65Z"/><path class="rally-ink" transform="translate(7674 0)" d="M65 700H201V115H551V0H65Z"/><path class="rally-ink" transform="translate(8235 0)" d="M249 286 0 700H149L316 413H318L485 700H634L385 286V0H249Z"/></g><path fill="#f05a28" d="m8914 65h68l-130 440h-68Z"/><path fill="#f05a28" d="m9029 65h68l-130 440h-68Z"/><path fill="#f05a28" d="m9144 65h68l-130 440h-68Z"/></svg></h1>
<div class="checkpoint"><p id="status" role="status">载入启动器</p><output id="amount" aria-hidden="true">—</output></div><div class="track"><progress id="progress" max="1" aria-label="游戏资源下载进度"></progress></div><p id="detail"></p>
<div class="art-grid" aria-hidden="true"><div class="art-card"><span class="plate">01</span><img src="/loader-art/autumn.webp" alt="" width="600" height="360" decoding="async"><span class="grain"></span></div><div class="art-card"><span class="plate">02</span><img src="/loader-art/f160.webp" alt="" width="600" height="360" decoding="async"><span class="grain"></span></div></div>
<ol class="steps" aria-label="启动阶段"><li id="step-launcher">启动器</li><li id="step-download">游戏资源</li><li id="step-engine">引擎准备</li></ol>
<div class="actions"><a class="back" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6-6 6 6 6M4 12h16"/></svg>返回首页</a><button class="primary" id="start" disabled><span>进入赛道</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6 6 6-6 6M20 12H4"/></svg></button><a class="primary" id="retry" href="" hidden>重新加载<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9A7 7 0 1 0 19 15M19 3v6h-6"/></svg></a></div><noscript>请启用 JavaScript 后重新加载。</noscript></div></section>
<script>
const canvas=document.querySelector('#canvas'),panel=document.querySelector('#panel'),status=document.querySelector('#status'),start=document.querySelector('#start'),progress=document.querySelector('#progress'),amount=document.querySelector('#amount'),detail=document.querySelector('#detail'),retry=document.querySelector('#retry');
const config=$GODOT_CONFIG;
const expectedBytes=Object.values(config.fileSizes||{}).reduce((sum,size)=>sum+size,0);
let engine,finished=false,lastBytes=0,lastActivity=Date.now(),watchdog;
function phase(name){panel.dataset.phase=name;const names=['launcher','download','engine'],active=names.indexOf(name);names.forEach((n,i)=>{document.querySelector('#step-'+n).className=i<active?'done':i===active?'active':'';});}
function resize(){const scale=Math.min(1,1280/innerWidth,720/innerHeight);canvas.width=Math.max(1,Math.round(innerWidth*scale));canvas.height=Math.max(1,Math.round(innerHeight*scale));}
resize();addEventListener('resize',resize);config.canvas=canvas;config.canvasResizePolicy=0;
function stopWatch(){clearInterval(watchdog);}
function runtimeFailure(error){finished=true;stopWatch();phase('error');panel.hidden=false;start.hidden=true;progress.removeAttribute('value');status.textContent='暂时无法出发';amount.textContent='—';detail.textContent='请检查网络或浏览器硬件加速后重试。';retry.hidden=false;console.error(error);}
config.onProgress=(current,total)=>{
 if(finished)return;
 const size=expectedBytes||total;
 if(current!==lastBytes){lastActivity=Date.now();lastBytes=current;}
 if(size>0){const ratio=Math.min(1,current/size);progress.value=ratio;amount.textContent=Math.floor(ratio*100)+'%';status.textContent='下载游戏资源';phase('download');detail.textContent=`已读取 ${(current/1048576).toFixed(1)} / ${(size/1048576).toFixed(1)} MiB · 解压后`;
 if(ratio>=1){phase('engine');progress.removeAttribute('value');amount.textContent='就绪中';status.textContent='准备引擎与赛道';detail.textContent='资源下载完成，正在初始化画面与浏览器存档。';lastActivity=Date.now();}
 }else{progress.removeAttribute('value');amount.textContent='—';status.textContent='读取游戏资源';detail.textContent='正在接收资源，暂时无法确定总量。';}
};
config.onExit=()=>{finished=true;stopWatch();phase('exit');panel.hidden=false;start.hidden=true;progress.value=1;status.textContent='本次驾驶已结束';amount.textContent='—';detail.textContent='可以返回首页，或重新载入赛道。';retry.hidden=false;};
addEventListener('error',event=>{if(event.target?.id==='godot-loader'||(event.error&&(!event.filename||event.filename.startsWith(location.origin+'/play/'))))runtimeFailure(event.error||'Launcher failed');},true);
addEventListener('unhandledrejection',event=>runtimeFailure(event.reason));
canvas.addEventListener('webglcontextlost',()=>runtimeFailure('WebGL context lost'));
start.addEventListener('click',async()=>{
 if(start.disabled||!engine)return;start.disabled=true;start.hidden=true;phase('download');progress.value=0;status.textContent='连接资源服务器';amount.textContent='0%';lastActivity=Date.now();
 try{if(!Engine.isWebGLAvailable(2))throw Error('WebGL 2 unavailable');await engine.startGame();if(finished)return;finished=true;stopWatch();requestAnimationFrame(()=>{panel.hidden=true;canvas.focus();});}catch(error){runtimeFailure(error);}
});
function launcherReady(){try{engine=new Engine(config);phase('ready');document.querySelector('#step-launcher').className='done';status.textContent='准备出发';detail.textContent='';progress.value=0;amount.textContent='—';start.disabled=false;}catch(error){runtimeFailure(error);}}
watchdog=setInterval(()=>{if(finished)return;if(Date.now()-lastActivity>20000&&['launcher','download','engine'].includes(panel.dataset.phase)){detail.textContent=panel.dataset.phase==='engine'?'引擎仍在准备中，请稍候；也可以重新加载。':'连接较慢，仍在等待资源；可以继续等待或重新加载。';retry.hidden=false;}},2000);
document.querySelector('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();canvas.focus();}catch(error){console.warn(error);}});
const visibility=()=>window.brushlineVisibility?.(document.hidden||!document.hasFocus());document.addEventListener('visibilitychange',visibility);addEventListener('blur',visibility);addEventListener('focus',visibility);canvas.addEventListener('contextmenu',event=>event.preventDefault());
</script><script id="godot-loader" src="$GODOT_URL" defer></script><script>document.querySelector('#godot-loader').addEventListener('load',launcherReady);</script>
</body></html>
